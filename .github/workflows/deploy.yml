name: Build & Deploy Finance App

on:
  push:
    branches:
      - main          # trigger on pushes to main
  workflow_dispatch:  # allow manual trigger from GitHub UI

# Queue deploys of this app so two runs never hit the instance at once
concurrency:
  group: deploy-finance-app
  cancel-in-progress: false

# Populated from GitHub Variables (non-sensitive)
env:
  AWS_REGION:      ${{ vars.AWS_REGION }}      # e.g. ap-southeast-2
  ECR_REGISTRY:    ${{ vars.ECR_REGISTRY }}    # e.g. 485530831906.dkr.ecr.ap-southeast-2.amazonaws.com
  ECR_REPOSITORY:  ${{ vars.ECR_REPOSITORY }}  # your finance app ECR repo name
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }} # e.g. i-0123456789abcdef0

jobs:
  build-and-push:
    name: Build Docker Image & Push to ECR
    runs-on: ubuntu-latest

    # OIDC permissions: lets the job exchange a short-lived token for AWS credentials
    permissions:
      id-token: write   # needed for OIDC JWT
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.sha-tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print GitHub context
        run: |
          echo "================================================"
          echo "  GitHub Deployment Context"
          echo "================================================"
          echo "  Organisation / Owner : ${{ github.repository_owner }}"
          echo "  Repository           : ${{ github.event.repository.name }}"
          echo "  Full repo path       : ${{ github.repository }}"
          echo "  Repository ID        : ${{ github.repository_id }}"
          echo "  Triggered by         : ${{ github.actor }}"
          echo "  Branch               : ${{ github.ref_name }}"
          echo "  Commit SHA           : ${{ github.sha }}"
          echo "  Run number           : ${{ github.run_number }}"
          echo "  Run ID               : ${{ github.run_id }}"
          echo "================================================"

      # Authenticate with AWS via OIDC (no long-lived keys, no SSH keys)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag (git SHA)
        id: meta
        run: echo "sha-tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          FULL_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          SHA_TAG:    ${{ steps.meta.outputs.sha-tag }}
        run: |
          # Pull previous image so its layers can be reused as build cache
          # (fails harmlessly on the very first run when the repo is empty)
          docker pull "$FULL_IMAGE:latest" || true

          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --tag "$FULL_IMAGE:$SHA_TAG" \
            --tag "$FULL_IMAGE:latest" \
            --cache-from "$FULL_IMAGE:latest" \
            .
          docker push "$FULL_IMAGE:$SHA_TAG"
          docker push "$FULL_IMAGE:latest"

  deploy:
    name: Deploy to EC2 via SSM (no SSH)
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
      # Re-authenticate (each job gets fresh credentials)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Trigger finance-app's deploy.sh on EC2 via SSM Run Command (no port 22 needed)
      - name: Run deploy.sh on EC2 via SSM
        id: ssm-deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }} bash /home/ubuntu/finance-app/deploy.sh"]' \
            --comment "Deploy finance-app ${{ github.sha }}" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"
          echo "command-id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # Wait for the command to finish and print its output
      - name: Wait for SSM command to complete
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command-id }}"
          INSTANCE_ID="${{ env.EC2_INSTANCE_ID }}"

          echo "Waiting for SSM command $COMMAND_ID to finish…"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "  [$i/30] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deploy succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "❌ Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timed out waiting for SSM command"
          exit 1
